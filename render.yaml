services:
  - type: web
    name: portfolio-ginjalahasini
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: CONTACT_TO
        value: hasinirg7@gmail.com
      # Set these in the Render dashboard to turn on real email delivery.
      # Without them the contact form still works and logs to the server console.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
