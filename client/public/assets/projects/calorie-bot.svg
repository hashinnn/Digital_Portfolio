<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Telegram Calorie Bot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1235"/>
      <stop offset="1" stop-color="#111640"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#2dd4bf" opacity="0.13"/>
    </pattern>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#dots)"/>

  <!-- chat bubble: the photo going in -->
  <rect x="48" y="86" width="196" height="132" rx="18" fill="#0a0f2c" stroke="#2dd4bf" stroke-opacity="0.35"/>
  <rect x="70" y="108" width="152" height="74" rx="9" fill="#2dd4bf" opacity="0.14"/>
  <circle cx="106" cy="136" r="12" fill="#2dd4bf" opacity="0.6"/>
  <path d="M78 176l34-32 24 22 20-16 30 28H78z" fill="#2dd4bf" opacity="0.45"/>
  <text x="70" y="204" font-family="'JetBrains Mono',monospace" font-size="13" fill="#f0f0f0" opacity="0.62">meal.jpg</text>
  <path d="M48 218l0-16 24 16z" fill="#0a0f2c" stroke="#2dd4bf" stroke-opacity="0.35"/>

  <!-- arrow -->
  <path d="M266 152h48M302 140l14 12-14 12" fill="none" stroke="#2dd4bf" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- results card -->
  <rect x="340" y="70" width="252" height="164" rx="18" fill="#0a0f2c" stroke="#2dd4bf" stroke-opacity="0.35"/>
  <text x="364" y="102" font-family="Outfit,sans-serif" font-size="13" letter-spacing="2.2" fill="#2dd4bf">ESTIMATE</text>

  <text x="364" y="146" font-family="Outfit,sans-serif" font-size="38" font-weight="700" fill="#f0f0f0">612</text>
  <text x="424" y="146" font-family="Outfit,sans-serif" font-size="14" fill="#f0f0f0" opacity="0.6">kcal</text>

  <g font-family="'JetBrains Mono',monospace" font-size="12" fill="#f0f0f0" opacity="0.72">
    <text x="364" y="176">protein</text><text x="540" y="176" text-anchor="end" fill="#2dd4bf">34 g</text>
    <text x="364" y="198">carbs</text><text x="540" y="198" text-anchor="end" fill="#2dd4bf">58 g</text>
    <text x="364" y="220">fat</text><text x="540" y="220" text-anchor="end" fill="#2dd4bf">21 g</text>
  </g>

  <g stroke="#2dd4bf" stroke-opacity="0.18">
    <line x1="364" y1="184" x2="568" y2="184"/>
    <line x1="364" y1="206" x2="568" y2="206"/>
  </g>

  <text x="48" y="296" font-family="Outfit,sans-serif" font-size="26" font-weight="700" fill="#f0f0f0">Telegram Calorie Bot</text>
  <text x="48" y="322" font-family="Outfit,sans-serif" font-size="14" fill="#f0f0f0" opacity="0.58">Photo in, macros out — Claude vision on Node.js</text>
</svg>
