<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Hospital Patient Flow Dashboard">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1235"/>
      <stop offset="1" stop-color="#111640"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#2dd4bf" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#dots)"/>

  <text x="40" y="52" font-family="Outfit,sans-serif" font-size="12" letter-spacing="2.4" fill="#2dd4bf">PATIENT FLOW</text>

  <!-- KPI row -->
  <g>
    <rect x="40" y="68" width="112" height="60" rx="10" fill="#0a0f2c" stroke="#2dd4bf" stroke-opacity="0.28"/>
    <text x="56" y="94" font-family="Outfit,sans-serif" font-size="22" font-weight="700" fill="#f0f0f0">4.2</text>
    <text x="56" y="113" font-family="Outfit,sans-serif" font-size="10" fill="#f0f0f0" opacity="0.55">avg stay (days)</text>

    <rect x="164" y="68" width="112" height="60" rx="10" fill="#0a0f2c" stroke="#2dd4bf" stroke-opacity="0.28"/>
    <text x="180" y="94" font-family="Outfit,sans-serif" font-size="22" font-weight="700" fill="#f0f0f0">87%</text>
    <text x="180" y="113" font-family="Outfit,sans-serif" font-size="10" fill="#f0f0f0" opacity="0.55">bed occupancy</text>

    <rect x="288" y="68" width="112" height="60" rx="10" fill="#0a0f2c" stroke="#2dd4bf" stroke-opacity="0.28"/>
    <text x="304" y="94" font-family="Outfit,sans-serif" font-size="22" font-weight="700" fill="#f0f0f0">1,284</text>
    <text x="304" y="113" font-family="Outfit,sans-serif" font-size="10" fill="#f0f0f0" opacity="0.55">admissions</text>
  </g>

  <!-- Occupancy trend -->
  <rect x="40" y="144" width="360" height="130" rx="12" fill="#0a0f2c" stroke="#2dd4bf" stroke-opacity="0.2"/>
  <text x="58" y="168" font-family="Outfit,sans-serif" font-size="11" fill="#f0f0f0" opacity="0.62">Occupancy by month</text>

  <g stroke="#f0f0f0" stroke-opacity="0.08">
    <line x1="58" y1="190" x2="382" y2="190"/>
    <line x1="58" y1="218" x2="382" y2="218"/>
    <line x1="58" y1="246" x2="382" y2="246"/>
  </g>

  <polyline points="58,240 94,226 130,232 166,208 202,214 238,190 274,196 310,178 346,186 382,170"
            fill="none" stroke="#2dd4bf" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#2dd4bf">
    <circle cx="166" cy="208" r="3"/><circle cx="238" cy="190" r="3"/>
    <circle cx="310" cy="178" r="3"/><circle cx="382" cy="170" r="3.6"/>
  </g>

  <!-- Ward bars -->
  <rect x="416" y="144" width="184" height="130" rx="12" fill="#0a0f2c" stroke="#2dd4bf" stroke-opacity="0.2"/>
  <text x="434" y="168" font-family="Outfit,sans-serif" font-size="11" fill="#f0f0f0" opacity="0.62">Length of stay by ward</text>

  <g font-family="Outfit,sans-serif" font-size="9" fill="#f0f0f0" opacity="0.5">
    <text x="434" y="192">A&amp;E</text><text x="434" y="214">Gen</text>
    <text x="434" y="236">ICU</text><text x="434" y="258">Rehab</text>
  </g>
  <g fill="#2dd4bf">
    <rect x="466" y="183" width="116" height="10" rx="5"/>
    <rect x="466" y="205" width="88"  height="10" rx="5" opacity="0.78"/>
    <rect x="466" y="227" width="62"  height="10" rx="5" opacity="0.56"/>
    <rect x="466" y="249" width="38"  height="10" rx="5" opacity="0.36"/>
  </g>

  <text x="40" y="316" font-family="Outfit,sans-serif" font-size="24" font-weight="700" fill="#f0f0f0">Hospital Patient Flow</text>
  <text x="40" y="338" font-family="Outfit,sans-serif" font-size="13" fill="#f0f0f0" opacity="0.58">Power BI · DAX · open government healthcare data</text>
</svg>
